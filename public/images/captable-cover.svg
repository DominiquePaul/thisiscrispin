<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <rect width="600" height="600" fill="#FAFAF8"/>
  <rect x="0" y="0" width="600" height="6" fill="#4A5899"/>

  <text x="300" y="132" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="24" font-weight="700"
        letter-spacing="6" fill="#9C9A93">CAP TABLE</text>

  <!-- ownership diluting across rounds: founders (blue) shrink as investors stack on -->
  <g>
    <!-- Founding -->
    <rect x="120" y="190" width="320" height="56" fill="#4A5899"/>
    <rect x="440" y="190" width="40"  height="56" fill="#C2C0BA"/>
    <!-- Seed -->
    <rect x="120" y="266" width="250" height="56" fill="#4A5899"/>
    <rect x="370" y="266" width="40"  height="56" fill="#C2C0BA"/>
    <rect x="410" y="266" width="70"  height="56" fill="#6B4A98"/>
    <!-- Series A -->
    <rect x="120" y="342" width="180" height="56" fill="#4A5899"/>
    <rect x="300" y="342" width="40"  height="56" fill="#C2C0BA"/>
    <rect x="340" y="342" width="60"  height="56" fill="#6B4A98"/>
    <rect x="400" y="342" width="80"  height="56" fill="#2F7A63"/>
    <!-- Exit -->
    <rect x="120" y="418" width="130" height="56" fill="#4A5899"/>
    <rect x="250" y="418" width="36"  height="56" fill="#C2C0BA"/>
    <rect x="286" y="418" width="50"  height="56" fill="#6B4A98"/>
    <rect x="336" y="418" width="64"  height="56" fill="#2F7A63"/>
    <rect x="400" y="418" width="80"  height="56" fill="#A8443C"/>
  </g>

  <text x="300" y="540" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600"
        fill="#1A1A18">Dilution across funding rounds</text>
</svg>
