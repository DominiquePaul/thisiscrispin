    <rect x="22" y="26" width="84" height="8" rx="4"/>
    <rect x="22" y="94" width="84" height="8" rx="4"/>
  </g>
  <circle cx="64" cy="64" r="27" fill="none" stroke="#ffffff" stroke-opacity="0.92" stroke-width="7"/>
